name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - name: Demo must FAIL under budget
        run: |
          node bin/visual-qa.mjs demo --out .qa-ci-demo
          node -e '
            const fs = require("fs");
            const r = require("./.qa-ci-demo/report.json");
            if (r.verdict !== "FAIL") {
              console.error("expected FAIL, got", r.verdict, r.coverage);
              process.exit(1);
            }
            if (r.complete !== true) {
              console.error("expected complete walk", r.coverage);
              process.exit(4);
            }
            if (r.coverage?.limit_reason) {
              console.error("unexpected limit", r.coverage.limit_reason);
              process.exit(5);
            }
            if ((r.coverage?.viewports_missing || []).length) {
              console.error("missing viewports", r.coverage.viewports_missing);
              process.exit(6);
            }
            if ((r.duration_ms || 0) > 180_000) {
              console.error("demo too slow", r.duration_ms);
              process.exit(2);
            }
            if (!Array.isArray(r.issues) || r.issues.length < 3) {
              console.error("expected seeded defects, got", r.issues?.length);
              process.exit(3);
            }
            for (const file of ["report.json", "report.md", "report.html"]) {
              if (!fs.existsSync("./.qa-ci-demo/" + file)) {
                console.error("missing artifact", file);
                process.exit(7);
              }
            }
            console.log("demo ok", r.verdict, r.duration_ms, r.issues.length, r.complete);
          '
